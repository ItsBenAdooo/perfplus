plugins {
    id 'fabric-loom' version '1.9.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    // Mod Menu Repository
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }

    // Cloth Config Repository
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // Minecraft 1.21.11 ve Mappings
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.5"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"

    // Mod Menu & Cloth Config (Harici Bağımlılıklar)
    modCompileOnly "com.terraformersmc:modmenu:17.0.1"
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:15.0.127"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
