plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    // Mod Menu Repository
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }

    // Cloth Config Repository
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // Minecraft ve Mappings
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.5"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.1"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:11.0.1"

    // Cloth Config (Kütüphaneyi mod olarak jar içine paketleme)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:15.0.127"
    include "me.shedaniel.cloth:cloth-config-fabric:15.0.127"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
